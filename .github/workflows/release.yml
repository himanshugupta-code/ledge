name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --mac dmg --arm64 --x64 --publish never -c.mac.identity=null
      - name: Name the downloads
        run: |
          cp release/Ledge-*-arm64.dmg release/Ledge-mac-arm64.dmg
          cp release/Ledge-*-x64.dmg release/Ledge-mac-x64.dmg
          ls -la release/*.dmg
      - name: Publish to GitHub Releases
        run: |
          version="v$(node -p "require('./package.json').version")"
          if ! gh release view "$version" > /dev/null 2>&1; then
            gh release create "$version" --title "Ledge $version" --notes "Download Ledge-mac-arm64.dmg for Apple silicon Macs or Ledge-mac-x64.dmg for Intel Macs. The app is not notarized yet, so the first time you open it, right-click Ledge in Applications and choose Open."
          fi
          gh release upload "$version" release/Ledge-mac-arm64.dmg release/Ledge-mac-x64.dmg --clobber
